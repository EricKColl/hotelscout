name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias y de integración
        run: npm test
      - name: Build de producción
        run: npm run build
      - name: Instalar Chromium para las pruebas e2e
        run: npx playwright install --with-deps chromium
      - name: Pruebas end-to-end y accesibilidad
        run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
